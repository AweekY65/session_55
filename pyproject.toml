[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dqtool"
version = "0.1.0"
description = "Local data-quality analysis and validation for CSV/JSONL/Parquet files (no external services)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5",
    "pyarrow>=10",
]

[project.scripts]
dqtool = "dqtool.cli:main"

[tool.setuptools.packages.find]
include = ["dqtool*"]
